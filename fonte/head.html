<style>
/* ===== Celular / telas pequenas ===== */
@media (max-width: 760px) {
  .hub-login { grid-template-columns: 1fr !important; grid-template-rows: auto 1fr; }
  .hub-login-hero { padding: 20px !important; gap: 0 !important; }
  .hub-login-hero > div:not(:first-child) { display: none !important; }
  .hub-login > div:last-child { padding: 24px 18px !important; place-items: start center !important; }
  .hub-app { grid-template-columns: minmax(0, 1fr) !important; }
  .hub-app > div:first-child { width: 0; height: 0; }
  .hub-aside { width: 270px !important; transform: translateX(-105%); transition: transform .2s ease !important; box-shadow: 12px 0 40px #0b2b5533 !important; }
  .hub-aside[data-open="1"] { transform: none; }
  .hub-aside [style*="opacity"] { opacity: 1 !important; }
  .hub-scrim { display: block !important; }
  .hub-menu-btn { display: grid !important; }
  .hub-main { padding: 12px 14px 90px !important; gap: 22px !important; }
  .hub-main h1 { font-size: 30px !important; line-height: 1.12 !important; }
  .hub-main h2 { font-size: 18px !important; }
  .hub-main [style*="grid-template-columns"]:not([data-mk]) { grid-template-columns: minmax(0, 1fr) !important; }
  .hub-main [data-mk="two"] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .hub-main [data-mk="keep"][style*="repeat(7"] { gap: 3px !important; }
  .hub-main [data-mk="keep"][style*="repeat(7"] > * { min-width: 0; overflow: hidden; }
  .hub-main [style*="font-size: 52px"], .hub-main [style*="font-size: 44px"], .hub-main [style*="font-size: 40px"] { font-size: 30px !important; }
  .hub-main [style*="min-width: 220px"], .hub-main [style*="min-width: 200px"] { min-width: 0 !important; }
  .hub-main div[style*="display: flex"][style*="align-items: center"] { flex-wrap: wrap; }
  .hub-main [data-mk] div[style*="display: flex"] { flex-wrap: nowrap; }
  .hub-main [style*="width: 400px"], .hub-main [style*="width: 440px"] { width: calc(100vw - 28px) !important; }
  .hub-main input, .hub-main select, .hub-main textarea { font-size: 16px !important; }
  .hub-fab { display: none !important; }
  aside[style*="position: sticky"] { position: static !important; }
